<script>
/* ===== Engine: pure functions, shared by the page and the node tests ===== */
var NG = (function () {
  "use strict";
  var E = {};

  /* ---------- money, text ---------- */
  E.parseCents = function (str) {
    if (typeof str === "number") return isFinite(str) ? Math.round(str * 100) : null;
    var s = String(str == null ? "" : str).trim();
    if (!s) return null;
    s = s.replace(/\s+/g, "").replace(/\u20ac/g, "").replace(/EUR/ig, "").replace(/\u2212/g, "-");
    var sign = 1;
    if (s.charAt(s.length - 1) === "-") { sign = -1; s = s.slice(0, -1); }
    if (s.charAt(0) === "-") { sign = -sign; s = s.slice(1); } else if (s.charAt(0) === "+") s = s.slice(1);
    if (!s) return null;
    var hasC = s.indexOf(",") !== -1, hasD = s.indexOf(".") !== -1;
    if (hasC && hasD) {
      if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", ".");
      else s = s.replace(/,/g, "");
    } else if (hasC) {
      s = s.replace(",", ".");
    } else if (hasD && /^\d{1,3}(\.\d{3})+$/.test(s)) {
      s = s.replace(/\./g, "");
    }
    if (!/^\d+(\.\d+)?$/.test(s)) return null;
    return sign * Math.round(parseFloat(s) * 100);
  };
  E.eur = function (cents) {
    var neg = cents < 0, a = Math.abs(Math.round(cents));
    var euros = Math.floor(a / 100), ct = String(a % 100);
    if (ct.length < 2) ct = "0" + ct;
    return (neg ? "\u2212" : "") + String(euros).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "," + ct;
  };
  E.maskIbans = function (s) {
    return String(s || "").replace(/\b[A-Z]{2}\d{2}[A-Z]{4}\d{6,26}\b|\b[A-Z]{2}\d{2}[A-Z0-9]{10,30}\b/g, function (m) {
      return m.slice(0, 4) + "\u2026" + m.slice(-4);
    });
  };
  E.norm = function (s) {
    return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/['\u2019`]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  };
  E.txKey = function (date, dir, cents, desc) {
    return [date || "", dir, cents, String(desc || "").trim().toLowerCase().replace(/\s+/g, " ")].join("|");
  };
  /* ---------- gesplitste boekingen ----------
     Eén boeking kan uit meerdere delen bestaan: parts = [{cat, cents, label}].
     Zonder parts is de boeking één geheel (t.cat en t.cents). De som van de delen is altijd t.cents. */
  E.partsOf = function (t) {
    if (t && Array.isArray(t.parts) && t.parts.length) {
      return t.parts.map(function (p) { return { cat: String(p.cat || ""), cents: Math.round(Number(p.cents) || 0), label: String(p.label || "") }; });
    }
    return [{ cat: String((t && t.cat) || ""), cents: t ? Math.round(Number(t.cents) || 0) : 0, label: "" }];
  };
  E.isSplit = function (t) { return !!(t && Array.isArray(t.parts) && t.parts.length > 1); };
  E.partsSum = function (parts) { var s = 0; (parts || []).forEach(function (p) { s += Math.round(Number(p && p.cents) || 0); }); return s; };
  /* keurt een splitsing: minstens twee delen, elk met een rubriek en een bedrag, samen precies het totaal */
  E.cleanParts = function (parts, total) {
    var out = [];
    (parts || []).forEach(function (p) {
      if (!p) return;
      var c = Math.round(Number(p.cents) || 0);
      if (!c) return;
      out.push({ cat: String(p.cat || ""), cents: c, label: String(p.label || "").trim() });
    });
    if (out.length < 2) return null;
    if (out.some(function (p) { return !p.cat; })) return null;
    if (E.partsSum(out) !== Math.round(Number(total) || 0)) return null;
    return out;
  };
  /* de grootste deel-rubriek; die blijft als hoofdrubriek op de boeking staan */
  E.mainCat = function (parts) {
    var best = null;
    (parts || []).forEach(function (p) { if (!best || Math.abs(p.cents) > Math.abs(best.cents)) best = p; });
    return best ? best.cat : "";
  };

  E.bookStart = function (iso) {
    var p = String(iso).split("-").map(Number);
    return p[1] >= 11 ? p[0] : p[0] - 1;
  };
  E.addDays = function (iso, n) {
    var d = new Date(iso + "T12:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  E.dayDiff = function (a, b) {
    return Math.round((Date.parse(a + "T12:00:00Z") - Date.parse(b + "T12:00:00Z")) / 86400000);
  };

  /* ---------- CSV ---------- */
  E.decodeBankBytes = function (bytes) {
    try {
      return new TextDecoder("utf-8", { fatal: true }).decode(bytes).replace(/^\uFEFF/, "");
    } catch (e) {
      return new TextDecoder("windows-1252").decode(bytes);
    }
  };
  E.parseCsv = function (text, delim) {
    var rows = [], row = [], cur = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (q) {
        if (ch === '"') { if (text.charAt(i + 1) === '"') { cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cur); cur = ""; }
      else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (ch !== "\r") cur += ch;
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows;
  };
  function detectDelim(text) {
    var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); }).slice(0, 20).join("\n");
    var counts = { ";": 0, ",": 0, "\t": 0 }, q = false;
    for (var i = 0; i < lines.length; i++) {
      var ch = lines.charAt(i);
      if (ch === '"') { q = !q; continue; }
      if (!q && counts.hasOwnProperty(ch)) counts[ch]++;
    }
    var best = ";", n = -1;
    [";", ",", "\t"].forEach(function (k) { if (counts[k] > n) { best = k; n = counts[k]; } });
    return best;
  }
  function hnorm(h) { return E.norm(h); }
  function parseIsoDate(s) {
    var t = String(s || "").trim(), m;
    if ((m = t.match(/^(\d{4})(\d{2})(\d{2})$/))) return m[1] + "-" + m[2] + "-" + m[3];
    if ((m = t.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[1] + "-" + m[2] + "-" + m[3];
    if ((m = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/))) return m[3] + "-" + pad2(m[2]) + "-" + pad2(m[1]);
    return null;
  }
  function pad2(x) { x = String(x); return x.length < 2 ? "0" + x : x; }
  E.parseIsoDate = parseIsoDate;

  /* Rabobank CSV: classic comma-quoted (IBAN/BBAN, Volgnr, Datum, Bedrag, Saldo na trn, ...),
     semicolon exports, tab. Header row detected anywhere near the top. */
  E.parseRabobankText = function (text) {
    var body = String(text || "").replace(/^\uFEFF/, "");
    if (!body.trim()) return { ok: false, error: "Het bestand is leeg." };
    var first = body.split(/\r?\n/, 1)[0].trim(), forced = null, m = first.match(/^sep\s*=\s*(.)$/i);
    if (m) { forced = m[1]; var nl = body.indexOf("\n"); body = nl === -1 ? "" : body.slice(nl + 1); }
    var delim = forced || detectDelim(body);
    var rows = E.parseCsv(body, delim), map = null, headerIdx = -1;
    for (var i = 0; i < Math.min(rows.length, 30) && !map; i++) {
      var ns = rows[i].map(hnorm), c = { date: -1, dateSc: 9, amount: -1, af: -1, desc: [], name: -1, nameSc: 9, tegen: -1, volgnr: -1, saldo: -1, own: -1, code: -1 };
      var namePrefs = ["naam tegenpartij", "tegenpartij", "naam uiteindelijke partij", "naam initierende partij", "naam"];
      ns.forEach(function (n, idx) {
        var ds = n === "transactiedatum" ? 1 : (n === "boekingsdatum" || n === "boekdatum") ? 2 : n === "datum" ? 3 : 0;
        if (ds && ds < c.dateSc) { c.dateSc = ds; c.date = idx; }
        if (c.amount === -1 && (n === "bedrag" || n === "bedrag eur" || n === "transactiebedrag" || n === "amount")) c.amount = idx;
        if (c.af === -1 && (n === "af bij" || n === "bij af" || n === "debet credit" || n === "credit debet")) c.af = idx;
        if (/^omschrijving/.test(n) || /^mededeling/.test(n)) c.desc.push(idx);
        var np = namePrefs.indexOf(n);
        if (np !== -1 && np < c.nameSc) { c.nameSc = np; c.name = idx; }
        if (c.tegen === -1 && /^tegenrekening/.test(n)) c.tegen = idx;
        if (c.volgnr === -1 && (n === "volgnr" || n === "volgnummer")) c.volgnr = idx;
        if (c.saldo === -1 && (n === "saldo na trn" || n === "saldo na transactie" || n === "saldo na boeking")) c.saldo = idx;
        if (c.own === -1 && (n === "iban bban" || n === "rekeningnummer" || n === "rekening" || n === "iban")) c.own = idx;
        if (c.code === -1 && n === "code") c.code = idx;
      });
      if (c.date !== -1 && c.amount !== -1) { map = c; headerIdx = i; map.raw = rows[i]; }
    }
    if (!map) return { ok: false, error: "Geen kopregel gevonden met een datum- en een bedragkolom (bijvoorbeeld Datum en Bedrag)." };
    var entries = [], skipped = [];
    for (var r = headerIdx + 1; r < rows.length; r++) {
      var row = rows[r];
      if (!row.some(function (x) { return String(x || "").trim(); })) continue;
      var date = parseIsoDate(row[map.date]), signed = E.parseCents(row[map.amount]);
      if (!date) { skipped.push({ row: r + 1, reason: "geen bruikbare datum" }); continue; }
      if (signed == null) { skipped.push({ row: r + 1, reason: "geen bruikbaar bedrag" }); continue; }
      if (signed === 0) { skipped.push({ row: r + 1, reason: "bedrag is 0" }); continue; }
      var af = map.af === -1 ? "" : String(row[map.af] || "").trim().toLowerCase(), dir = null;
      if (af === "af" || af === "d" || af === "debet" || af === "debit") dir = "uit";
      else if (af === "bij" || af === "c" || af === "credit") dir = "in";
      else dir = signed < 0 ? "uit" : "in";
      var name = map.name === -1 ? "" : String(row[map.name] || "").replace(/\s+/g, " ").trim();
      var omschr = map.desc.map(function (idx) { return String(row[idx] || ""); }).join(" ").replace(/\s+/g, " ").trim();
      var parts = [];
      if (name) parts.push(E.maskIbans(name));
      if (omschr && omschr !== name) parts.push(E.maskIbans(omschr));
      var tegen = map.tegen === -1 ? "" : String(row[map.tegen] || "").trim();
      var own = map.own === -1 ? "" : String(row[map.own] || "").trim();
      var e = { date: date, dir: dir, cents: Math.abs(signed), desc: parts.join(" \u00b7 ") || "Zonder omschrijving" };
      if (tegen) e.tegen = E.maskIbans(tegen);
      if (own) e.own = E.maskIbans(own);
      if (map.volgnr !== -1 && String(row[map.volgnr] || "").trim()) e.volgnr = String(row[map.volgnr]).trim().replace(/^0+/, "") || "0";
      if (map.saldo !== -1) { var sc = E.parseCents(row[map.saldo]); if (sc != null) e.saldo = sc; }
      if (map.code !== -1 && row[map.code]) e.code = String(row[map.code]).trim();
      e.signed = signed;
      entries.push(e);

  if (q) return "staat al bij Nieuwe facturen (" + q.name + ")";
  var changed = false, hit = null;
  for (var i = 0; i < state.invoices.length; i++) {
    var inv = state.invoices[i];
    if (!inv.sha) {
      try { var rec = await fileGet(inv.id); if (rec) { inv.sha = rec.sha || await intakeSha(await dataUrlToBlob(rec.dataUrl).arrayBuffer()); changed = true; } } catch (e) { /* bestand weg */ }
    }
    if (inv.sha === sha && !hit) hit = "al bewaard als factuur van " + (inv.leverancier || inv.fileName) + (inv.datum ? ", " + nlDate(inv.datum) : "");
  }
  if (changed) save();
  return hit;
}
function intakeBlank() { return { leverancier: "", datum: "", bedrag: "", nummer: "", cat: "", account: "bank", dir: "uit", link: "new" }; }
async function intakeReceive(file) {
  if (firstRun || !state) return { ok: false, retry: true, error: "het kasboek is nog niet geladen" };
  if (!file || !file.bytes || !/^[0-9a-f]{64}$/.test(String(file.sha || ""))) return { ok: false, error: "ongeldig bestand" };
  var bytes = file.bytes instanceof Uint8Array ? file.bytes : new Uint8Array(file.bytes);
  if (await intakeSha(bytes) !== file.sha) return { ok: false, retry: true, error: "controle (SHA-256) klopt niet" };
  var name = String(file.name || "factuur").slice(0, 200), kind = intakeKindOf(name, file.mime);
  if (!kind) return { ok: false, error: "geen pdf, jpg, png of heic" };
  var dup = await intakeFindDup(file.sha);
  if (dup) { intakeNote("Dubbel bestand overgeslagen: " + name + " (" + dup + ")."); return { ok: true, dup: true }; }
  var mime = file.mime || INTAKE_MIME[kind], fileId = uid("f");
  try { await filePut({ id: fileId, name: name, mime: mime, size: bytes.length, sha: file.sha, dataUrl: await readAsDataUrl(new Blob([bytes], { type: mime })) }); }
  catch (e) { return { ok: false, error: "bestand opslaan in het kasboek mislukt: " + (e && e.message || e) }; }
  var q = { id: uid("q"), fileId: fileId, name: name, mime: mime, size: bytes.length, sha: file.sha, kind: kind, received: new Date().toISOString(), source: "dropbox", fields: intakeBlank(), notes: [], text: "", method: "", status: "" };
  try { await intakeParse(q, bytes); } catch (e) { q.error = "Lezen mislukt: " + (e && e.message || e) + ". Vul de velden zelf in."; if (!q.fields.leverancier) intakeFromText(q, ""); }
  intakeRefresh(q);
  intakeList().push(q);
  var stored = false;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); stored = !!(await fileGet(fileId)); } catch (e) { stored = false; }
  if (!stored) { state.intake = intakeList().filter(function (x) { return x !== q; }); try { await fileDel(fileId); } catch (e) { /* */ } return { ok: false, error: "opslaan in het kasboek mislukt (opslag vol?)" }; }
  intakeToast(1); intakeRepaint();
  return { ok: true, sure: q.sure };
}

/* akkoord: wat er verandert (zonder het al te doen), doorvoeren en terugdraaien (voor AI-ongedaan maken) */
function intakeEffect(q) {
  var f = q.fields, c = NG.parseCents(f.bedrag), cents = c != null ? Math.abs(c) : null;
  if (f.link !== "none" && !cents) return { error: "Vul een bedrag in om te koppelen of te boeken." };
  if (f.cat && !catByCode(f.cat)) return { error: "Onbekende rubriek: " + f.cat };
  var inv = { id: q.fileId, fileName: q.name, mime: q.mime, size: q.size, sha: q.sha, leverancier: String(f.leverancier || "").trim(), datum: f.datum || "", cents: cents, nummer: String(f.nummer || "").trim(), cat: f.cat || "", account: f.account, dir: f.dir, txId: null, method: q.method || "", added: today(), source: "dropbox", received: q.received };
  var eff = { inv: inv, newTx: null, edit: null };
  if (f.link === "new") {
    if (!f.datum) return { error: "Vul de factuurdatum in voor de nieuwe boeking." };
    if (isClosed(String(NG.bookStart(f.datum)))) return { error: "Die datum valt in een afgesloten boekjaar. Kies \u201calleen bewaren\u201d of een andere datum." };
    var t = { id: uid("m"), date: f.datum, account: f.account, dir: f.dir, cents: cents, desc: (inv.leverancier || "Factuur") + (inv.nummer ? " \u00b7 factuur " + inv.nummer : ""), cat: f.cat || "", src: "factuur", invoiceId: inv.id };
    if (f.cat) t.catBy = "user";
    inv.txId = t.id; eff.newTx = t;
  } else if (f.link !== "none") {
    var tx = findTx(f.link);
    if (!tx) return { error: "De gekozen boeking bestaat niet meer." };
    if (isLocked(tx)) return { error: "De gekozen boeking valt in een afgesloten boekjaar." };
    if (tx.invoiceId && tx.invoiceId !== inv.id) return { error: "Die boeking heeft al een factuur." };
    var after = clone(tx); after.invoiceId = inv.id;
    if (!after.cat && f.cat) { after.cat = f.cat; after.catBy = "user"; delete after.sug; }
    inv.txId = tx.id; eff.edit = { id: tx.id, before: clone(tx), after: after };
  }
  return eff;
}
function intakeSetTx(id, value) { for (var i = 0; i < state.transactions.length; i++) if (state.transactions[i].id === id) { state.transactions[i] = clone(value); return; } }
function intakeApplyEffect(qid, eff) {
  state.intake = intakeList().filter(function (x) { return x.id !== qid; });
  state.invoices.push(clone(eff.inv));
  if (eff.newTx) state.transactions.push(clone(eff.newTx));
  if (eff.edit) intakeSetTx(eff.edit.id, eff.edit.after);
}
function intakeRevertEffect(item, eff) {
  state.invoices = state.invoices.filter(function (i) { return i.id !== eff.inv.id; });
  if (eff.newTx) state.transactions = state.transactions.filter(function (t) { return t.id !== eff.newTx.id; });
  if (eff.edit) intakeSetTx(eff.edit.id, eff.edit.before);
  if (!intakeById(item.id)) intakeList().push(clone(item));
}
function intakeCheck(ch, side) { /* voor aiCheck: "before" = kan nog worden doorgevoerd, "after" = kan worden teruggedraaid */
  var eff = ch.after;
  if (side === "before") {
    var q = intakeById(ch.id); if (!q || q.sha !== ch.before.sha) return false;
    if (state.invoices.some(function (i) { return i.id === eff.inv.id; })) return false;
    if (eff.edit) { var t = findTx(eff.edit.id); if (!t || !aiSame(t, eff.edit.before) || isLocked(t) || (t.invoiceId && t.invoiceId !== eff.inv.id)) return false; }
    if (eff.newTx && (findTx(eff.newTx.id) || isClosed(String(NG.bookStart(eff.newTx.date))))) return false;
    return true;
  }
  if (intakeById(ch.id)) return false;
  var inv = state.invoices.filter(function (i) { return i.id === eff.inv.id; })[0]; if (!inv || inv.txId !== eff.inv.txId) return false;
  if (eff.edit) { var t2 = findTx(eff.edit.id); if (!t2 || !aiSame(t2, eff.edit.after) || isLocked(t2)) return false; }
  if (eff.newTx) { var t3 = findTx(eff.newTx.id); if (!t3 || !aiSame(t3, eff.newTx) || isLocked(t3)) return false; }
  return true;
}
function intakeAccept(id) {
  var q = intakeById(id); if (!q) return null;
  var eff = intakeEffect(q);
  if (eff.error) { q.error = eff.error; return null; }
  intakeApplyEffect(q.id, eff); return eff;
}
function intakeAcceptSure() {
  var n = 0, fails = 0;
  intakeList().slice().forEach(function (q) { intakeRefresh(q); if (!q.sure) return; if (intakeAccept(q.id)) n++; else fails++; });
  return { n: n, fails: fails };
}

}

/* ---------- 4. overnemen ---------- */
function excelTakeCats() {
  var A = excelState && excelState.analysis, n = 0;
  if (!A || isClosed(A.year)) return 0;
  EXCEL_POTS.forEach(function (pot) {
    A.pots[pot].pairs.forEach(function (p) {
      if (!p.catDiff || !p.catDiff.excel) return;
      if (isLocked(p.t)) return;
      if (p.part != null && p.t.parts && p.t.parts[p.part]) {
        p.t.parts[p.part].cat = p.catDiff.excel;
        p.t.cat = NG.mainCat(p.t.parts);
      } else p.t.cat = p.catDiff.excel;
      p.t.catBy = "excel";
      delete p.t.sug;
      n++;
    });
  });
  return n;
}
function excelApply(removeExtra) {
  var A = excelState && excelState.analysis;
  if (!A) return { error: "Laad eerst het Excel." };
  var y = A.year;
  if (isClosed(y)) return { error: "Boekjaar " + yearLabel(y) + " is afgesloten; er kan niets worden overgenomen." };
  var cats = excelTakeCats(), added = 0, removed = 0;
  EXCEL_POTS.forEach(function (pot) {
    A.pots[pot].alleen.forEach(function (e) {
      var t = { id: uid("x"), by: y, date: e.date || null, account: pot, dir: e.dir, cents: e.cents, desc: e.desc || "(zonder omschrijving)", cat: e.cat || "", src: "excel" };
      if (!e.date && e.dateText) t.dateText = e.dateText;
      if (t.cat) t.catBy = "excel";
      state.transactions.push(t); added++;
    });
  });
  if (removeExtra) {
    var weg = {};
    EXCEL_POTS.forEach(function (pot) { A.pots[pot].alleenApp.forEach(function (t) { if (!isLocked(t)) weg[t.id] = 1; }); });
    if (Object.keys(weg).length) {
      state.transactions = state.transactions.filter(function (t) { return !weg[t.id]; });
      state.invoices.forEach(function (i) { if (i.txId && weg[i.txId]) i.txId = null; });
      removed = Object.keys(weg).length;
    }
  }
  runAuto();
  return { cats: cats, added: added, removed: removed };
}
function excelLoadFile(file) {

  }).then(function (res) {
    if (res.error) { excelState = { error: res.error, file: file.name }; excelArmCats = excelArmApply = false; render(); return; }
    excelState = res;
    excelArmCats = excelArmApply = false;
    excelRefresh();
    save();
    flash = "Excel ingelezen: " + (res.pots.kas.rows.length + res.pots.bank.rows.length + res.pots.spaar.rows.length) + " regels voor boekjaar " + yearLabel(res.year) + ". " + (res.analysis ? res.analysis.zin : "");
    render();
  }).catch(function (e) {

function excelAct(act) {
  if (act === "excelarmcats") { excelArmCats = true; excelArmApply = false; render(); return; }
  if (act === "excelarmapply") { excelArmApply = true; excelArmCats = false; render(); return; }
  if (act === "excelcancel") { excelArmCats = excelArmApply = false; render(); return; }
  if (act === "excelcats") {
    if (!excelState || !excelState.analysis) return;
    excelArmCats = false;
    var n = excelTakeCats();
    runAuto(); save(); excelRefresh(); save();
    flash = n + (n === 1 ? " rubriek overgenomen" : " rubrieken overgenomen") + " uit het Excel.";
    render(); return;
  }
  if (act === "excelapply") {
    if (!excelState || !excelState.analysis) return;

    var rm = !!(document.getElementById("excelremoveextra") || {}).checked;
    var r = excelApply(rm);
    if (r.error) { flash = r.error; render(); return; }
    save(); excelRefresh(); save();
    flash = "Excel in het kasboek gezet: " + r.cats + (r.cats === 1 ? " rubriek" : " rubrieken") + " overgenomen, " + r.added + (r.added === 1 ? " boeking" : " boekingen") + " toegevoegd" + (rm ? ", " + r.removed + " verwijderd" : "") + ". " + (excelState.analysis ? excelState.analysis.zin : "");

      rows.push(rptRow([p.e.date || "", p.e.desc, p.e.cat ? excelCatName(p.e.cat) : "", p.e.cents, p.t.date || "", p.t.desc, p.t.cat ? excelCatName(p.t.cat) : "", p.t.cents, p.e.cents - p.t.cents, p.status === "gelijk" ? "gelijk" : p.dateDiff && p.catDiff ? "datum en rubriek wijken af" : p.dateDiff ? "datum wijkt af" : "rubriek wijkt af"]));
    });
    P.andere.forEach(function (x) { rows.push(rptRow([x.e.date || "", x.e.desc, x.e.cat ? excelCatName(x.e.cat) : "", x.e.cents, x.t.date || "", x.t.desc, x.t.cat ? excelCatName(x.t.cat) : "", x.t.cents, 0, "staat op " + accountLabel(x.t.account).toLowerCase()])); });
    P.alleen.forEach(function (e) { rows.push(rptRow([e.date || "", e.desc, e.cat ? excelCatName(e.cat) : "", e.cents, "", "", "", "", e.cents, "alleen in het Excel"])); });
    P.alleenApp.forEach(function (t) { rows.push(rptRow([t.date || "", "", "", "", t.date || "", t.desc, t.cat ? excelCatName(t.cat) : "", t.cents, -t.cents, "alleen in het kasboek"])); });
    secs.push(rptSection(EXCEL_NAMES[pot] + " \u2014 " + P.rows + " regels in het Excel", EXCEL_NAMES[pot], [C_DATE("Datum Excel"), C_TXT("Omschrijving Excel", 44), C_TXT("Rubriek Excel", 26), C_EUR("Bedrag Excel"), C_DATE("Datum kasboek"), C_TXT("Omschrijving kasboek", 44), C_TXT("Rubriek kasboek", 26), C_EUR("Bedrag kasboek"), C_EUR("Verschil"), C_TXT("Status", 24)], rows, { foot: P.countText }));
  });
  var r = { club: RPT_CLUB, title: "Excel-controle " + yearLabel(y), period: { year: y, from: y + "-11-01", to: (Number(y) + 1) + "-10-31", label: "Boekjaar " + yearLabel(y) }, potLabel: "alle potten", generated: new Date().toISOString(), sections: secs, notes: ["Bestand: " + (excelState.file || "") + " \u00b7 boekjaar bepaald " + (excelState.yearSrc || "") + ".", A.zin].concat(excelState.warnings || []) };
  return rptXlsx(r);
}
async function excelSaveXlsx() {
  var A = excelState && excelState.analysis;
  if (!A) { flash = "Laad eerst het Excel."; render(); return; }
  var name = "Kasboek Excel-controle " + yearLabel(A.year).replace("/", "-") + ".xlsx", data;
  try { data = excelControleXlsx(); } catch (e) { flash = "Er ging iets mis: " + (e && e.message || e); render(); return; }
  if (DESKTOP && DESKTOP.saveReport) {
    var s = await DESKTOP.saveReport(name, data, "xlsx");
    flash = s && s.ok ? "Controle opgeslagen: " + s.path : s && s.cancelled ? "Opslaan geannuleerd." : "Opslaan mislukt" + (s && s.error ? ": " + s.error : "") + ".";
  } else { rptDownload(name, data, EXCEL_MIME); flash = "Het bestand \u201c" + name + "\u201d staat in uw map Downloads."; }
  render();
}
